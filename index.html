<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="content="width=device-width,initial-scale=1" />
  <title>Neon Bastion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div><span class="eyebrow">SECTOR 7</span><h1>NEON BASTION</h1></div>
      <div class="stats">
        <div><span>CREDITS</span><strong id="gold">300</strong></div>
        <div><span>CORE</span><strong id="lives">20</strong></div>
        <div><span>WAVE</span><strong id="wave">1</strong></div>
      </div>
    </header>

    <section class="play-area">
      <canvas id="game" width="960" height="600" aria-label="Tower defense game"></canvas>
      <aside class="shop">
        <h2>DEFENSE GRID</h2>
        <button class="tower-card selected" data-type="pulse">
          <span class="icon pulse">◆</span><span><strong>PULSE</strong><small>Fast • 100</small></span>
        </button>
        <button class="tower-card" data-type="cannon">
          <span class="icon cannon">⬢</span><span><strong>CANNON</strong><small>Heavy • 160</small></span>
        </button>
        <button class="tower-card" data-type="frost">
          <span class="icon frost">✦</span><span><strong>FROST</strong><small>Slow • 130</small></span>
        </button>
        <button id="start-wave" class="start">DEPLOY WAVE</button>
      </aside>
    </section>

    <footer>
      <span id="status">Place defenses, then deploy the wave.</span>
      <button id="pause">Ⅱ PAUSE</button>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
