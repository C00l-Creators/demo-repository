<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050914" />
  <title>Neon Bastion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div><span class="eyebrow">SECTOR 7</span><h1>NEON BASTION</h1></div>
      <div class="stats">
        <div><span>COINS</span><strong id="gold">300</strong></div>
        <div><span>CORE HP</span><strong id="lives">100</strong></div>
        <div><span>WAVE</span><strong id="wave">1</strong></div>
      </div>
    </header>

    <section class="play-area">
      <canvas id="game" width="960" height="600" aria-label="Neon Bastion tower defense game"></canvas>
      <aside class="shop">
        <div class="shop-heading"><div><span class="eyebrow">ARMORY</span><h2>DEFENSE GRID</h2></div><span id="tower-count">24 UNITS</span></div>
        <p class="shop-help">Choose a unit, then click open terrain to deploy it.</p>
        <div id="tower-list" class="tower-list" aria-label="Tower shop"></div>
        <button id="start-wave" class="start">DEPLOY WAVE</button>
      </aside>
    </section>

    <footer>
      <span id="status">Choose a defense, place it, then deploy the wave.</span>
      <button id="pause">Ⅱ PAUSE</button>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
